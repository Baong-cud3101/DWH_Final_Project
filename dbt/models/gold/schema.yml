version: 2

models:
  - name: dim_date
    description: "Dimension ngày 2020-01-01 đến 2023-12-31; phân cấp ngày, tuần, tháng, quý, năm."
    columns:
      - name: date_key
        description: "Surrogate key dạng YYYYMMDD."
        data_tests: [unique, not_null]
      - name: full_date
        data_tests: [unique, not_null]

  - name: dim_customer
    description: "Dimension khách hàng (SCD Type 1). Email đã băm md5; không lưu họ tên và ngày sinh; tuổi đổi thành nhóm tuổi. Có thành viên Unknown (-1)."
    columns:
      - name: customer_key
        description: "Surrogate key."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Khóa tự nhiên."
        data_tests: [unique, not_null]
      - name: email_hash
        description: "md5(email) - che dữ liệu cá nhân."
      - name: age_group
        data_tests: [not_null]
      - name: income_band
        data_tests: [not_null]
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['Consumer', 'Corporate', 'Self-Employed', 'Unknown']

  - name: dim_product
    description: "Dimension sản phẩm: product -> subcategory -> category. Có thành viên Unknown (-1)."
    columns:
      - name: product_key
        data_tests: [unique, not_null]
      - name: product_code
        data_tests: [unique, not_null]

  - name: dim_region
    description: "Dimension khu vực: city -> state -> country -> region -> market -> market_group. Có thành viên Unknown (-1)."
    columns:
      - name: region_key
        data_tests: [unique, not_null]
      - name: region_code
        data_tests: [unique, not_null]

  - name: dim_segment
    description: "Dimension phân khúc: Consumer, Corporate, Self-Employed. Có thành viên Unknown (-1)."
    columns:
      - name: segment_key
        data_tests: [unique, not_null]
      - name: segment_name
        data_tests: [unique, not_null]

  - name: dim_flags
    description: "Junk dimension: is_valid_product x is_valid_region x discount_band x is_loss (48 tổ hợp)."
    columns:
      - name: flag_key
        data_tests: [unique, not_null]

  - name: fact_sales
    description: "Transaction fact. Grain: row_id (một sản phẩm trong một đơn). order_id là degenerate dimension. Sắp xếp vật lý theo order_date."
    columns:
      - name: row_id
        description: "Khóa grain."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Degenerate dimension."
        data_tests: [not_null]
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: region_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region_key
      - name: segment_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_segment')
                field: segment_key
      - name: flag_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_flags')
                field: flag_key
      - name: sales
        description: "Doanh thu dòng (USD)."
        data_tests: [not_null]
      - name: profit
        description: "Lợi nhuận dòng (USD), có thể âm."
        data_tests: [not_null]
      - name: implied_cost
        description: "Chi phí ngầm = sales - profit."

  - name: fact_monthly_snapshot
    description: "Periodic snapshot fact. Grain: tháng x market x segment, lưới đầy đủ (ô trống = 0). Phục vụ theo dõi tăng trưởng, bão hòa và biên theo thời gian."
    data_tests:
      - unique_combination:
          arguments:
            columns: ['month_key', 'market', 'segment']
    columns:
      - name: month_key
        data_tests: [not_null]
